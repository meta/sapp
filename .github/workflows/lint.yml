name: lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  ufmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install ufmt
        run: pip install 'ufmt>=2.9.0' 'black==25.11.0' 'ruff-api>=0.1.0'

      - name: Add configuration for ufmt
        run: echo -e '[tool.ufmt]\nformatter = "ruff-api"\nsorter = "ruff-api"' > pyproject.toml

      - name: Run ufmt
        run: ufmt diff sapp scripts

  flake8:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8==6.1.0

      - name: Run flake8
        run: flake8

  ESLint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install packages and run ESLint
        run: |
          cd sapp/ui/frontend
          npm install
          npm run lint
